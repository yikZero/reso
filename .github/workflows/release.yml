name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd KoeApp && xcodegen generate

      - name: Build Rust library (arm64)
        run: cargo build --manifest-path koe-core/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build Rust library (x86_64)
        run: cargo build --manifest-path koe-core/Cargo.toml --release --target x86_64-apple-darwin

      - name: Create universal Rust library
        run: |
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/libkoe_core.a \
            target/x86_64-apple-darwin/release/libkoe_core.a \
            -output target/release/libkoe_core.a
          cp target/release/libkoe_core.a target/aarch64-apple-darwin/release/libkoe_core.a
          cp target/release/libkoe_core.a target/x86_64-apple-darwin/release/libkoe_core.a

      - name: Build universal Xcode project
        env:
          SKIP_RUST_BUILD: "1"
        run: |
          cd KoeApp && xcodebuild \
            -project Reso.xcodeproj \
            -scheme Reso \
            -configuration Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create DMG
        run: |
          BUILD_DIR=$(xcodebuild -project KoeApp/Reso.xcodeproj -scheme Reso -configuration Release -showBuildSettings 2>/dev/null | grep ' BUILD_DIR' | head -1 | awk '{print $3}')
          APP_PATH="$BUILD_DIR/Release/Reso.app"

          DMG_DIR=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"

          hdiutil create -volname "Reso" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "$BUILD_DIR/Release/Reso-macOS-universal.dmg"

          echo "ARTIFACT_PATH=$BUILD_DIR/Release/Reso-macOS-universal.dmg" >> $GITHUB_ENV

      - name: Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" KoeApp/Reso/Info.plist)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: ${{ env.ARTIFACT_PATH }}
          draft: false
          generate_release_notes: true

      - name: Update feed JSON
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          TAG="${{ steps.version.outputs.tag }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > docs/update-feed.json << EOF
          {
            "version": "$VERSION",
            "build": $BUILD,
            "published_at": "$NOW",
            "minimum_system_version": "13.0",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/$TAG/Reso-macOS-universal.dmg",
            "release_notes_url": "https://github.com/${{ github.repository }}/releases/tag/$TAG",
            "notes": []
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add docs/update-feed.json
          git commit -m "chore(release): update feed for $TAG"
          git push origin main
